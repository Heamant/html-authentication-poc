<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-Auth-POC | Reset Password</title>
</head>

<body>
    <center>
        <h2>Reset Password Page</h2>
        <label for="emailID">Email: </label>
        <input id="emailID" type="text" placeholder="enter your user email"><br><br>

        <label for="newPasswordID">New Password: </label>
        <input id="newPasswordID" type="password" placeholder="enter your new password"><br><br>

        <label for="confirmPasswordID">Confirm Password: </label>
        <input id="confirmPasswordID" type="password" placeholder="enter your confirm password"><br><br>

        <a href="login.html">
            <input type="submit" value="Update Password">
        </a>
    </center>
</body>

</html>
