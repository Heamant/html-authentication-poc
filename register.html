<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-Auth-POC | Registration</title>
</head>

<body>
    <center>
        <h2>Registration Page</h2>
        <label for="nameID">Name: </label>
        <input id="nameID" type="text" placeholder="enter your name"><br><br>

        <label for="emailID">Email: </label>
        <input id="emailID" type="email" placeholder="enter your email"><br><br>
        
        <label for="phoneNumberlID">Phone Number: </label>
        <input id="phoneNumberlID" type="number" placeholder="enter your phone number"><br><br>
        
        <label for="passwordID">Password: </label>
        <input id="passwordID" type="password" placeholder="enter your password"><br><br>

        <label for="confirmPasswordID">Confirm Password: </label>
        <input id="confirmPasswordID" type="password" placeholder="enter your confirm password"><br><br>

        <a href="login.html">
            <input type="submit" value="Register"><br><br>
        </a>

        <a href="login.html">I already have an account</a>
    </center>
</body>

</html>
