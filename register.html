<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-Auth-POC | Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth-container">

        <!-- LEFT -->
        <div class="auth-form-section">
            <div class="auth-box">
                <h3 class="mb-4">Create Account</h3>

                <form action="login.html">
                    <input class="form-control mb-3" placeholder="Full Name" required>
                    <input type="email" class="form-control mb-3" placeholder="Email" required>
                    <input type="tel" class="form-control mb-3" placeholder="Phone Number" required>
                    <input type="password" class="form-control mb-3" placeholder="Password" required>
                    <input type="password" class="form-control mb-3" placeholder="Confirm Password" required>

                    <button class="btn btn-success w-100">Register</button>
                </form>

                <div class="mt-3">
                    <a href="login.html">Already have an account?</a>
                </div>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="auth-info-section">
            <div>
                <h1>Join Us 🚀</h1>
                <p>Create your account and start using the platform.</p>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
