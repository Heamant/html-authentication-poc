<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-Auth-POC | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth-container">

        <!-- LEFT -->
        <div class="auth-form-section">
            <div class="auth-box">
                <h3 class="mb-4">Login</h3>

                <form action="dashboard.html">
                    <input class="form-control mb-3" placeholder="Username" required>
                    <input type="password" class="form-control mb-3" placeholder="Password" required>

                    <button class="btn btn-primary w-100">Login</button>
                </form>

                <div class="mt-3">
                    <a href="forgot-password.html">Forgot Password?</a><br>
                    <a href="register.html">Create Account</a>
                </div>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="auth-info-section">
            <div>
                <h1>Welcome Back</h1>
                <p>This is a professional desktop authentication layout.</p>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
