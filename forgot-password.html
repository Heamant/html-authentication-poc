<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-Auth-POC | Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth-container">

        <div class="auth-form-section">
            <div class="auth-box">
                <h3 class="mb-4">Forgot Password</h3>

                <form action="reset-password.html">
                    <input type="email" class="form-control mb-3" placeholder="Enter your email" required>

                    <button class="btn btn-warning w-100">Send Reset Link</button>
                </form>

                <div class="mt-3">
                    <a href="login.html">Back to Login</a>
                </div>
            </div>
        </div>

        <div class="auth-info-section">
            <div>
                <h1>Password Help 🔐</h1>
                <p>We’ll send you a link to reset your password.</p>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
