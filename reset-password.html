<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-Auth-POC | Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth-container">

        <div class="auth-form-section">
            <div class="auth-box">
                <h3 class="mb-4">Reset Password</h3>

                <form action="login.html">
                    <input type="password" class="form-control mb-3" placeholder="New Password" required>
                    <input type="password" class="form-control mb-3" placeholder="Confirm Password" required>

                    <button class="btn btn-danger w-100">Update Password</button>
                </form>

                <div class="mt-3">
                    <a href="login.html">Back to Login</a>
                </div>
            </div>
        </div>

        <div class="auth-info-section">
            <div>
                <h1>Secure Your Account 🔒</h1>
                <p>Choose a strong password to protect your account.</p>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
